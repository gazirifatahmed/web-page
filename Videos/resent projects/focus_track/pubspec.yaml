name: focus_track
description: "A NoFap habit tracker app with streak counting, badges, and progress tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1          # অ্যাপ আইকন জেনারেটরের জন্য

flutter:
  uses-material-design: true

  # অ্যাসেট ফোল্ডার ডিক্লেয়ার করা (ভবিষ্যতে অন্য ছবি/ফাইল ব্যবহার করতে চাইলে সুবিধা হবে)
  assets:
    - assets/icon/app_icon.png             # আপনার কাস্টম আইকন ইমেজ

# flutter_launcher_icons প্যাকেজের কনফিগারেশন
flutter_launcher_icons:
  android: true                            # Android এর জন্য আইকন জেনারেট করবে
  ios: true                                # iOS এর জন্য আইকন জেনারেট করবে
  image_path: "assets/icon/app_icon.png"   # আপনার আইকনের পাথ
  # remove_alpha_ios: true                 # iOS এ স্বচ্ছ ব্যাকগ্রাউন্ড জনিত সমস্যা হলে কমেন্ট খুলুন